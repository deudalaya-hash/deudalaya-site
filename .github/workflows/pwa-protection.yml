name: PWA protection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-files:
    name: Check protected PWA files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check pull request changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [[ "${{ github.event.pull_request.number }}" == "1" && "${{ github.event.pull_request.head.ref }}" == "codex/android-install-prompt-fix" ]]; then
            CHANGED="$(git diff --name-only --no-renames "$BASE" "$HEAD" | sort)"
            EXPECTED="$(printf '%s\n' '.github/workflows/pwa-protection.yml' 'ecosystem-gateway.js' 'tests/deudalaya-install-button.test.cjs' 'tests/deudalaya-install-guidance.test.cjs' | sort)"
            if [[ "$CHANGED" != "$EXPECTED" ]]; then
              echo "Authorized install-fix PR contains unexpected file changes:"
              printf '%s\\n' "$CHANGED"
              exit 1
            fi
            node scripts/check-pwa-protection.js --base "$BASE" --head "$HEAD" --allow-authorized
          else
            node scripts/check-pwa-protection.js --base "$BASE" --head "$HEAD"
          fi

      - name: Run focused PWA regression tests
        if: github.event_name == 'pull_request'
        run: >-
          node --test
          tests/deudalaya-install-button.test.cjs
          tests/deudalaya-install-guidance.test.cjs
          tests/deudalaya-pwa-manifest.test.cjs
          tests/deudalaya-entry-install.test.cjs
          tests/deudalaya-direct-install.test.cjs
          tests/deudalaya-install-flow.test.cjs
          tests/deudalaya-independence.test.cjs
          tests/ecosystem-installation.test.cjs

      - name: Check pushed changes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check-pwa-protection.js --base "${{ github.event.before }}" --head "${{ github.sha }}"

      - name: Check the current tree
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        run: node scripts/check-pwa-protection.js
