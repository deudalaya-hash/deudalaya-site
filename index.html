/* ============ RENDER ============ */
const $ = (tag, cls, text) => {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text != null) el.textContent = text;
  return el;
};
const img = (src, alt) => { const i = $("img"); i.src = src; i.alt = alt; i.loading = "lazy"; i.decoding = "async"; return i; };
const link = (href, child) => { const a = $("a"); a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; a.append(child); return a; };
const details = (label, open) => {
  const d = $("details", "imgs"); d.open = !!open;
  d.append($("summary", null, label));
  return d;
};

function render(p) {
  const el = $("article", "phase" + (p.bare ? " bare" : ""));
  if (p.id) el.id = p.id;
  if (p.soon) { el.append($("div", "soon", p.soon)); return el; }

  el.append($("p", "num", "PHASE " + p.n), $("p", "laya", p.t));
  (p.d || []).forEach(line => el.append($("p", "desc", line)));

  if (p.poster) el.append(Object.assign(link(p.poster[0], img(...p.poster)), { className: "poster-solo" }));

  if (p.gal) {
    const d = details(p.gal.label, p.gal.open), g = $("div", "gallery " + p.gal.kind);
    p.gal.items.forEach(([s, a]) => g.append(link(s, img(s, a))));
    d.append(g); el.append(d);
  }

  if (p.blog) {
    const d = details("blog posts"), wrap = $("div", "blog-posts"), post = $("div", "blog-post");
    wrap.setAttribute("role", "region"); wrap.setAttribute("aria-label", "Blog posts"); wrap.tabIndex = 0;
    BLOG.forEach((line, i) => { const row = $("p"); row.append(i ? line : Object.assign($("strong"), { textContent: line })); post.append(row); });
    wrap.append(post); d.append(wrap); el.append(d);
    d.addEventListener("toggle", () => { if (d.open) requestAnimationFrame(() => wrap.scrollLeft = wrap.scrollWidth); });
  }

  if (p.next) { const n = $("div", "next"); n.id = "next"; n.hidden = true; el.append(n); }

  if (p.bloglink) { const a = $("a", "btn", "Open blog page"); a.href = "blog.html"; el.append(a); }

  if (p.sanjh) {
    const d = details("weekly schedule"), box = $("div", "sanjh");
    SANJH.forEach(([day, what]) => { const row = $("p"); row.append(Object.assign($("strong"), { textContent: day }), " — " + what); box.append(row); });
    box.append($("p", "time", "बेलुका ५:००–७:०० बजे 🌙"));
    d.append(box); el.append(d);
  }

  if (p.contact) {
    const cta = $("div", "cta");
    [["📞 Call", "tel:+9779747704316"], ["💬 WhatsApp", "https://wa.me/9779747704316"], ["📧 Email", "mailto:deudalay@gmail.com"]]
      .forEach(([label, href]) => { const a = $("a", "btn", label); a.href = href; cta.append(a); });
    const wrap = $("div", "socials");
    SOCIALS.filter(s => s[2] !== "#").forEach(([icon, name, href]) => {
      const item = $("div", "social"), a = $("a", null, icon);
      a.href = href; a.title = name; a.setAttribute("aria-label", name);
      item.append(a, $("span", null, name)); wrap.append(item);
    });
    const top = $("a", "top", "↑ BACK TO TOP"); top.href = "#home";
    el.append(cta, wrap, $("div", "footer", "Deuda Laya Pvt. Ltd."), top,
      $("p", "copyright", "© " + new Date().getFullYear() + " Deuda Laya Pvt. Ltd. All rights reserved."));
  }
  return el;
}

/* sync background लयपुर with the big title: same width, same spot, stays fixed while scrolling */
const MARK_SCALE = 1.15; // make bigger/smaller: 1.0 = same width as the title text
const MARK_X = 0;  // move right (+) or left (-), in pixels
const MARK_Y = 0;  // move down (+) or up (-), in pixels
const mark = document.getElementById("mark");
function syncMark() {
  const h1 = document.querySelector(".hero h1"), box = h1.parentElement;
  const range = document.createRange(); range.selectNodeContents(h1);
  const textW = range.getBoundingClientRect().width, b = box.getBoundingClientRect();
  mark.style.width = Math.round(textW * MARK_SCALE) + "px";
  mark.style.left = (b.left + scrollX + b.width / 2 + MARK_X) + "px";
  mark.style.top = (b.top + scrollY + h1.offsetTop + h1.offsetHeight / 2 + MARK_Y) + "px";
}
syncMark();
addEventListener("load", syncMark);
addEventListener("resize", syncMark);
if (document.fonts) document.fonts.ready.then(syncMark);

/* Nepali date (Bikram Sambat). Month lengths per year, Baisakh to Chaitra.
   1 Baisakh 2083 = 14 April 2026. 2083 is official; 2084+ is provisional.
   Each new year: add one line here. Dates outside this table simply show no Nepali date. */
const BS_START = Date.UTC(2026, 3, 14);
const BS_YEARS = {
  2083: [31,31,32,31,31,31,30,29,30,29,30,30],
  2084: [31,32,31,32,31,30,30,30,29,29,30,31],
  2085: [30,32,31,32,31,30,30,30,29,30,29,31],
  2086: [31,31,32,31,31,31,30,29,30,29,30,30]
};
const BS_MONTHS = ["बैशाख","जेठ","असार","साउन","भदौ","असोज","कार्तिक","मंसिर","पौष","माघ","फागुन","चैत"];
const BS_DAYS = ["आइतबार","सोमबार","मङ्गलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
const ne = n => String(n).replace(/\d/g, d => "०१२३४५६७८९"[d]);
function toBS(date) {
  let n = Math.round((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - BS_START) / 864e5);
  if (n < 0) return null;
  for (const y of Object.keys(BS_YEARS)) {
    for (let m = 0; m < 12; m++) {
      const len = BS_YEARS[y][m];
      if (n < len) return { y, m, d: n + 1 };
      n -= len;
    }
  }
  return null;
}

/* next Deuda Sanjh: every Friday, 5-7 PM */
(function () {
  const box = document.getElementById("next"), now = new Date();
  let add = (5 - now.getDay() + 7) % 7;
  if (add === 0 && now.getHours() >= 19) add = 7;
  const d = new Date(now); d.setDate(now.getDate() + add);
  const when = add === 0 ? "Today, Friday" : d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const bs = toBS(d);
  const nepali = bs ? BS_DAYS[d.getDay()] + ", " + ne(bs.d) + " " + BS_MONTHS[bs.m] + " " + ne(bs.y) : "";
  box.append($("small", null, "NEXT DEUDA SANJH · देउडा साँझ"), $("strong", null, when));
  if (nepali) box.append($("span", "ne", nepali));
  box.append($("span", null, "5:00–7:00 PM · Shankhamul Park, Kathmandu"));
  box.hidden = false;
})();

/* dark / light toggle */
const tbtn = document.getElementById("theme-toggle");
const setTheme = (t, save) => {
  document.documentElement.dataset.theme = t;
  tbtn.textContent = t === "dark" ? "☀️" : "🌙";
  tbtn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  if (save) { try { localStorage.setItem("theme", t); } catch (e) {} }
};
setTheme(document.documentElement.dataset.theme, false);
tbtn.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));

/* scroll reveal */
if (!matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window) {
  document.documentElement.classList.add("has-reveal");
  const io = new IntersectionObserver((entries, obs) => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("seen"); obs.unobserve(e.target); }
  }), { threshold: .15, rootMargin: "0px 0px -40px 0px" });
  document.querySelectorAll(".phase").forEach(el => io.observe(el));
}
