:root{
 --bg:#fdfdfb;--bg-grad:radial-gradient(circle at top,rgba(255,255,255,.92),rgba(253,253,251,.97) 28%,#f4f2ed 100%);
 --surface:rgba(255,255,255,.1);--hero-bg:rgba(255,255,255,.18);--text:#2b2b2b;--desc:#444;--muted:#666;--line:#deded8;--rule:#bbb;--grid:#aaa;
 --accent:#a65f3b;--tint:rgba(166,95,59,.1);--soon:#584197;--shadow:rgba(0,0,0,.14);--r:22px;
 --glow:rgba(166,95,59,.35);
 --display:"Nirmala UI","Noto Sans Devanagari",sans-serif;
 --serif:"Nirmala UI","Noto Sans Devanagari","Segoe UI",sans-serif;
 --sans:"Segoe UI",Helvetica,Arial,sans-serif;
 color-scheme:light}
:root[data-theme="dark"]{
 --bg:#17140f;--bg-grad:radial-gradient(circle at top,#2a241c,#17140f 42%,#0e0c0a 100%);
 --surface:rgba(255,255,255,.03);--hero-bg:rgba(255,255,255,.025);--text:#ece7de;--desc:#cfc8bc;--muted:#a39b8f;--line:#352f27;--rule:#5a5249;--grid:#6b6256;
 --accent:#dd9068;--tint:rgba(221,144,104,.14);--soon:#b7a4ff;--shadow:rgba(0,0,0,.55);
 --glow:rgba(221,144,104,.4);
 color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{position:relative;isolation:isolate;margin:0;overflow-x:clip;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 color:var(--text);background:var(--bg-grad);background-color:var(--bg);text-align:center;font:300 16px/1.6 var(--sans);transition:color .35s,background .4s}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
section{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:40px 20px}

/* theme toggle */
.theme-toggle{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);z-index:20;
 width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;line-height:1;cursor:pointer;
 display:grid;place-items:center;box-shadow:0 4px 18px var(--shadow);transition:transform .25s,border-color .25s,box-shadow .25s}
.theme-toggle:hover{transform:rotate(22deg) scale(1.06);border-color:var(--accent);box-shadow:0 0 20px var(--glow)}

/* ========== HERO ========== */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);border-bottom:1px solid var(--line)}
.hero>*{position:relative;z-index:2}

/* multi-ring grid */
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transform:scale(1.1);
 background-image:
  linear-gradient(var(--grid) 1px,transparent 1px),
  linear-gradient(90deg,var(--grid) 1px,transparent 1px),
  radial-gradient(circle,transparent 0 70px,var(--grid) 71px,transparent 72px),
  radial-gradient(circle,transparent 0 140px,var(--grid) 141px,transparent 142px),
  radial-gradient(circle,transparent 0 220px,var(--grid) 221px,transparent 222px),
  radial-gradient(circle,transparent 0 320px,var(--grid) 321px,transparent 322px),
  radial-gradient(circle,transparent 0 440px,var(--grid) 441px,transparent 442px);
 background-size:70px 70px,70px 70px,100% 100%,100% 100%,100% 100%,100% 100%,100% 100%;
 animation:gridIn 3.2s ease-out 1.2s forwards}

.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:40vh;background:url("bg.jpg") no-repeat center bottom/cover;mix-blend-mode:multiply;
 -webkit-mask-image:linear-gradient(to bottom,transparent,#000 42%);mask-image:linear-gradient(to bottom,transparent,#000 42%);pointer-events:none}
:root[data-theme="dark"] .hero::after{mix-blend-mode:normal;opacity:.38}

/* floating particles */
.hero-dots{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.hero-dots span{position:absolute;border-radius:50%;background:var(--accent);
 animation:floatY 7s ease-in-out infinite,glowPulse 4s ease-in-out infinite}
.hero-dots span:nth-child(1){top:14%;left:10%;width:5px;height:5px;opacity:.4;animation-delay:0s,.2s}
.hero-dots span:nth-child(2){top:28%;right:12%;width:8px;height:8px;opacity:.28;animation-delay:1s,0s}
.hero-dots span:nth-child(3){top:52%;left:6%;width:4px;height:4px;opacity:.45;animation-delay:2.2s,.8s}
.hero-dots span:nth-child(4){top:68%;right:8%;width:6px;height:6px;opacity:.32;animation-delay:.6s,1.4s}
.hero-dots span:nth-child(5){top:20%;left:52%;width:5px;height:5px;opacity:.35;animation-delay:2.8s,.4s}
.hero-dots span:nth-child(6){top:44%;right:26%;width:9px;height:9px;opacity:.22;animation-delay:1.5s,1.1s}
.hero-dots span:nth-child(7){top:78%;left:30%;width:4px;height:4px;opacity:.4;animation-delay:3.2s,.6s}
.hero-dots span:nth-child(8){top:36%;left:22%;width:7px;height:7px;opacity:.25;animation-delay:.4s,2s}

/* SVG rings */
.hero-rings{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(95vw,860px);height:min(95vw,860px);
 z-index:1;pointer-events:none;opacity:.18}
:root[data-theme="dark"] .hero-rings{opacity:.13}
.hero-rings circle{fill:none;stroke:var(--accent);stroke-width:1.2}
.hero-rings .r1{animation:ringPulse 5s ease-in-out infinite}
.hero-rings .r2{animation:ringPulse 5s ease-in-out 1s infinite;stroke-width:1}
.hero-rings .r3{animation:ringPulse 5s ease-in-out 2s infinite;stroke-width:.8}
.hero-rings .r4{animation:ringPulse 5.5s ease-in-out 2.8s infinite;stroke-width:.6;opacity:.7}

.title-block{position:relative}
.mark{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:min(90vw,700px);height:auto;z-index:-1;pointer-events:none;user-select:none;
 opacity:.09;animation:fade 2s ease .5s both}
:root[data-theme="dark"] .mark{filter:invert(1);opacity:.06}

@keyframes fade{from{opacity:0}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 transparent;opacity:.3}50%{box-shadow:0 0 12px var(--glow);opacity:.55}}
@keyframes ringPulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.85;transform:scale(1.04)}}
@keyframes gridIn{from{opacity:0;transform:scale(.82)}to{opacity:.2;transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes titleGlow{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 28px var(--glow)}}

.url{font-size:14px;letter-spacing:3px;color:var(--muted);margin-top:45px}

.brand-block{display:flex;flex-direction:column;align-items:center;margin-top:-14px}

[data-theme="dark"] .brand{mix-blend-mode:normal;border-radius:12px;background:#fff}

@media(max-width:600px){.brand-block{margin-top:-18px}.brand{width:100px;height:69px}}
.region{margin:22px 0 -22px;font-size:15px;line-height:1.2;font-weight:600;letter-spacing:1px;color:var(--accent)}
@media(max-width:600px){.region{font-size:13px;margin:18px 0 -12px}}
h1{font:600 clamp(80px,18vw,170px)/1.1 var(--display);margin:10px 0;color:var(--text);
 animation:up 1.2s ease .5s both,titleGlow 5s ease-in-out 2s infinite}
h2{font:300 clamp(20px,6.2vw,34px) var(--sans);letter-spacing:3px;margin:0}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:26px 0}
.divider span{width:70px;height:1px;background:var(--rule);transform-origin:center;animation:lineGrow 1.4s ease 1.3s both}
.divider i{width:8px;height:8px;border:1px solid var(--rule);border-radius:50%;position:relative;animation:dotPop 1s ease 1.5s both}
.divider i::before,.divider i::after{content:"";position:absolute;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.divider i::before{width:16px;height:16px;border:1px solid var(--accent);opacity:.4;animation:ringPulse 3s ease-in-out 2s infinite}
.divider i::after{width:4px;height:4px;background:var(--accent);opacity:.7}
@keyframes lineGrow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes dotPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

.role{font-size:16px;letter-spacing:2px;margin:0 0 14px;color:var(--muted)}
.scroll,.top{font-size:13px;letter-spacing:3px;color:var(--muted);text-decoration:none;transition:color .25s,transform .25s,text-shadow .25s}
.scroll:hover,.top:hover{color:var(--accent);transform:translateY(-3px);text-shadow:0 0 12px var(--glow)}
.top{display:inline-block;margin-top:32px}
.url,.welcome,h2,.divider,.role{animation:up 1.2s ease both}
.welcome{animation-delay:.2s}h2{animation-delay:.9s}.divider{animation-delay:1.15s}.role{animation-delay:1.35s}

/* ========== PHASES ========== */
.phases{position:relative;isolation:isolate;width:100%;max-width:1000px;margin:0 auto;padding:20px 20px 40px;justify-content:flex-start}
.phases::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;
 background-image:linear-gradient(var(--tint) 1px,transparent 1px),linear-gradient(90deg,var(--tint) 1px,transparent 1px);background-size:68px 68px;
 -webkit-mask-image:linear-gradient(90deg,#000,transparent 28%,transparent 72%,#000);mask-image:linear-gradient(90deg,#000,transparent 28%,transparent 72%,#000)}
.phases::after{content:"";position:absolute;left:50%;top:8%;transform:translateX(-50%);width:min(720px,92vw);height:520px;
 background:radial-gradient(ellipse,var(--tint) 0%,transparent 68%);z-index:-1;pointer-events:none;opacity:.75;animation:glowBreathe 8s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.5;transform:translateX(-50%) scale(1)}50%{opacity:.85;transform:translateX(-50%) scale(1.06)}}

.sub{font:500 24px/1.2 var(--display);letter-spacing:3px;color:var(--muted);margin:0 0 28px;position:relative}
.sub::before,.sub::after{content:"";position:absolute;top:50%;width:42px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.sub::before{right:calc(100% + 14px);background:linear-gradient(90deg,var(--accent),transparent)}
.sub::after{left:calc(100% + 14px)}

.sub-desc{margin:-14px 0 28px;padding:0 16px;font:500 17px/1.4 "Dancing Script",cursive;letter-spacing:1px;color:var(--muted)}
.phase-list{width:min(780px,100%);margin:0 auto}
.phase-index{width:min(850px,100%);margin:0 auto 28px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);text-align:left;
 transition:border-color .3s,box-shadow .3s}
.phase-index:hover{border-color:var(--accent);box-shadow:0 0 24px var(--glow)}
.phase-index summary{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;color:var(--accent);cursor:pointer;font-size:13px;letter-spacing:2px}
.phase-index summary span+span{color:var(--muted);font-size:12px;letter-spacing:1px;white-space:nowrap}
.phase-index nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;max-height:min(60vh,500px);max-height:min(60svh,500px);overflow-y:auto;padding:0 18px 18px}
.phase-index nav a{padding:12px;border-radius:12px;font-size:15px;line-height:1.4;text-decoration:none;transition:background .2s,color .2s,transform .2s}
.phase-index nav a:hover,.phase-index nav a:focus-visible{color:var(--accent);background:var(--tint);transform:translateX(4px)}

.phase{width:100%;margin:0 0 10px;padding:28px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);
 transition:transform .3s cubic-bezier(.16,1,.3,1),border-color .3s,opacity .5s ease-out,box-shadow .35s;
 position:relative;overflow:hidden}
.phase::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,transparent,var(--accent),transparent);
 opacity:0;transition:opacity .35s}
.phase::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(600px circle at var(--mx,50%) var(--my,50%),var(--tint),transparent 40%);opacity:0;transition:opacity .35s}
.phase:hover::before{opacity:1}
.phase:hover::after{opacity:1}
.phase:last-child{margin-bottom:0}
@media(hover:hover){.phase:hover{border-color:var(--accent);transform:translateX(5px) translateY(-2px);box-shadow:0 12px 36px var(--shadow),0 0 28px var(--glow)}}
.phase.bare{padding:0;border:0;border-radius:0;background:none}
.phase.bare::before,.phase.bare::after{display:none}
@media(hover:hover){.phase.bare:hover{transform:none;box-shadow:none}}
.has-reveal .phase{opacity:0;transform:translateY(22px) scale(.98)}
.has-reveal .phase.seen{opacity:1;transform:none}

.num{font-size:11px;letter-spacing:2px;color:var(--accent);margin:0 0 4px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.num img{width:18px;height:18px;object-fit:contain;border-radius:4px;flex-shrink:0}
.num::before{display:none}
.laya{font:500 clamp(18px,3.6vw,26px)/1.3 var(--serif);letter-spacing:1px;margin:0 0 6px;display:inline-block;color:var(--text)}
.laya::after{content:"";display:block;width:28px;height:1px;background:var(--accent);margin:6px auto 0;transition:width .3s}
.phase:hover .laya::after{width:55px}
.desc,.laya{overflow-wrap:anywhere}
.desc{margin:4px 0;color:var(--desc);font-size:15px}
.soon{font:500 clamp(22px,3.5vw,32px) "Dancing Script",cursive;letter-spacing:1px;color:var(--soon);margin:0;position:relative;
 animation:soonGlow 4s ease-in-out infinite}
.soon::before,.soon::after{content:"✦";font-size:14px;opacity:.55;margin:0 12px;vertical-align:middle}
@keyframes soonGlow{0%,100%{text-shadow:0 0 0 transparent;opacity:.9}50%{text-shadow:0 0 18px var(--soon);opacity:1}}

/* images */
.imgs{margin-top:18px}
.imgs>summary{display:inline-block;padding:12px 18px;border:1px solid var(--line);border-radius:999px;color:var(--accent);cursor:pointer;font-size:13px;letter-spacing:1px;
 transition:background-color .25s,color .25s,box-shadow .25s,transform .2s}

 scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--accent) var(--line)}

 flex-shrink:0;scroll-snap-align:start}

 .gallery img:hover{transform:translateY(-5px) scale(1.04);box-shadow:0 14px 36px var(--shadow),0 0 20px var(--glow);z-index:2}
 .poster-solo img:hover{transform:translateY(-5px) scale(1.04);box-shadow:0 14px 36px var(--shadow),0 0 20px var(--glow)}
}
.gallery.thumb img{width:140px}

 transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .3s}

 transition:background-color .25s,color .25s,box-shadow .25s,transform .2s}

.dest-card{padding:20px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);transition:transform .3s,border-color .3s,box-shadow .3s}
.dest-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 0 24px var(--glow)}
.dest-card h3{margin:14px 0 8px;font-size:21px;font-weight:500;color:var(--text)}

.dest-card small{display:block;font-size:10px;letter-spacing:2px}
.dest-no{color:var(--accent)}
.dest-prov{margin-top:16px;color:var(--text)}
@media(max-width:600px){.dest-grid{grid-template-columns:1fr;gap:12px}.dest-card{padding:18px 14px}}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
.phase,.url,.welcome,h1,h2,.divider,.role{animation:none!important;opacity:1!important;transform:none!important}

.hero-dots span,.hero-rings circle,.soon,.next,.flourish i{animation:none!important}
}

/* stronger, darker hover effects */
.dest-card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 16px 34px rgba(0,0,0,.32),0 0 0 2px var(--accent),0 0 26px var(--glow)}

.btn:hover{box-shadow:0 10px 26px rgba(0,0,0,.35),0 0 22px var(--glow)}
@media(hover:hover){
  .phase:not(.bare):hover{border-color:var(--accent);transform:translateX(6px) translateY(-4px);box-shadow:0 20px 48px rgba(0,0,0,.34),0 0 0 2px var(--accent),0 0 34px var(--glow)}
}

.imgs>summary{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border-radius:50%;font-size:0;line-height:0;letter-spacing:0;list-style:none}

const $ = (tag, cls, text) => {
  const el = document.createElement(tag);

  if (text != null) el.textContent = text;
  return el;
};
const img = (src, alt) => { const i = $("img"); i.src = src; i.alt = alt; i.loading = "lazy"; i.decoding = "async"; return i; };
const link = (href, child) => { const a = $("a"); a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; a.append(child); return a; };
const details = (label, open) => {
  const d = $("details", "imgs"); d.open = !!open;
  const sm = $("summary", null, label);
  sm.title = label; sm.setAttribute("aria-label", label);
  d.append(sm);
  return d;
};

/* Nepali date (Bikram Sambat) */
const BS_START = Date.UTC(2026, 3, 14);
const BS_YEARS = {
  2083: [31,31,32,31,31,31,30,29,30,29,30,30],
  2084: [31,32,31,32,31,30,30,30,29,29,30,31],
  2085: [30,32,31,32,31,30,30,30,29,30,29,31],
  2086: [31,31,32,31,31,31,30,29,30,29,30,30]
};
const BS_MONTHS = ["बैशाख","जेठ","असार","साउन","भदौ","असोज","कार्तिक","मंसिर","पौष","माघ","फागुन","चैत"];
const BS_DAYS = ["आइतबार","सोमबार","मङ्गलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
const ne = n => String(n).replace(/\d/g, d => "०१२३४५६७८९"[d]);
function toBS(date) {
  let n = Math.round((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - BS_START) / 864e5);
  if (n < 0) return null;
  for (const y of Object.keys(BS_YEARS)) {
    for (let m = 0; m < 12; m++) {
      const len = BS_YEARS[y][m];
      if (n < len) return { y, m, d: n + 1 };
      n -= len;
    }
  }
  return null;
}

/* scroll reveal – iOS-friendly */
(function () {
  const phases = document.querySelectorAll(".phase");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !("IntersectionObserver" in window)) {
    phases.forEach(el => el.classList.add("seen"));
    return;
  }
  document.documentElement.classList.add("has-reveal");
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("seen");
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.08, rootMargin: "0px 0px -20px 0px" });
  phases.forEach(el => io.observe(el));
  // safety: force visible after 2s if observer never fired (iOS quirk)
  setTimeout(() => {
    phases.forEach(el => { if (!el.classList.contains("seen")) el.classList.add("seen"); });
  }, 2000);

  // mouse glow on phase cards
  document.querySelectorAll(".phase:not(.bare)").forEach(card => {
    card.addEventListener("pointermove", e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty("--mx", (e.clientX - r.left) + "px");
      card.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
  });
})();
